<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Taffybop — Coming Soon</title>
  <meta
    name="description"
    content="Taffybop is coming soon."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #ed5853;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 650px;
      padding: 40px 24px;
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 16px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #475569;
      border-radius: 999px;
      color: #e2e8f0;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 38px;
      }

      h1 {
        font-size: 32px;
      }

      p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">Taffybop</div>

    <h1>Something awesome is coming.</h1>

    <p>
      We're working behind the scenes to bring Taffybop to life.
      Stay tuned.
    </p>

    <div class="badge">Work in progress</div>
  </div>
</body>
</html>
